version: '3.8'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgresql://user:pass@postgres:5432/scraper
      - REDIS_URL=redis://redis:6379
  
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: scraper
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    
  worker:
    build: .
    command: celery -A app.celery worker --loglevel=info
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: 